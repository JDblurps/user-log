<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}SimpleChat{% endblock %}
    </title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'app.css' %}">

</head>

<body>

<header class="topbar">

    <a class="brand" href="{% url 'inbox' %}">
        SimpleChat
    </a>

    <nav>

        {% if user.is_authenticated %}

            <a href="{% url 'inbox' %}">Chats</a>

            <a href="{% url 'people' %}">People</a>

            <a href="{% url 'groups' %}">Groups</a>

            <span class="muted">
                {{ user.username }}
            </span>

            <form method="post" action="{% url 'logout' %}" class="inline">

                {% csrf_token %}

                <button class="link-button" type="submit">
                    Log out
                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Log in
            </a>

            <a href="{% url 'register' %}">
                Create account
            </a>

        {% endif %}

    </nav>

</header>


<main class="shell">

    {% if messages %}

        {% for message in messages %}

            <p class="notice">
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}

    {% block content %}

    {% endblock %}

</main>

</body>

</html>
