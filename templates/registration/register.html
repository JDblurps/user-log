{% extends "base.html" %}

{% block title %}Create account · SimpleChat{% endblock %}

{% block content %}

<section class="panel narrow">

    <h1>Create account</h1>

    <p class="muted">
        Your username is what other people see on the site.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="primary" type="submit">Create account</button>

    </form>

    <p class="muted">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
    </p>

</section>

{% endblock %}
